<!DOCTYPE html>
<html class="light scroll-smooth" lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="theme-color" content="#4f46e5">
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Luxuria Pure Cleaning Services | Professional Home & Commercial Cleaning</title>
    <meta name="title" content="Luxuria Pure Cleaning Services | Professional Home & Commercial Cleaning">
    <meta name="description" content="Experience top-tier residential and commercial cleaning services. Reliable, insured, and detail-oriented professionals dedicated to keeping your spaces pristine.">
    <meta name="keywords" content="cleaning services, residential cleaning, commercial cleaning, deep cleaning, professional cleaners, home cleaning">
    <meta name="author" content="ARFLOW">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cleaning.mutechlabs.com/">
    <meta property="og:title" content="LuxuriaPure Cleaning Services | Professional Home & Commercial Cleaning">
    <meta property="og:description" content="Experience top-tier residential and commercial cleaning services. Reliable, insured, and detail-oriented professionals dedicated to keeping your spaces pristine.">
    <meta property="og:image" content="https://cleaning.mutechlabs.com/public/assets/img/LuxuriaPureCover.png">

    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://cleaning.mutechlabs.com/">
    <meta property="twitter:title" content="LuxuriaPure Cleaning Services | Professional Home & Commercial Cleaning">
    <meta property="twitter:description" content="Experience top-tier residential and commercial cleaning services. Reliable, insured, and detail-oriented professionals dedicated to keeping your spaces pristine.">
    <meta property="twitter:image" content="https://cleaning.mutechlabs.com/public/assets/img/LuxuriaPureCover.png">

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&amp;display=swap"
        rel="stylesheet" />
    <script src="tailwind.js" id="tailwind-config"></script>
    <script src="js/modules/auth-guard.js"></script>
</head>

<body
    class="bg-background text-on-background min-h-screen flex selection:bg-primary-fixed selection:text-primary-container">
    <div id="sideAdminMenu"></div>

    <div id="sidebar-backdrop"
        onclick="document.getElementById('mobile-sidebar')?.classList.add('-translate-x-full'); this.classList.add('hidden')"
        class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 hidden md:hidden"></div>

    <div
        class="md:hidden fixed top-0 left-0 w-full z-10 flex items-center justify-between bg-surface-container-lowest p-4 border-b border-outline-variant/30 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full overflow-hidden border border-outline-variant/30 flex-shrink-0">
                <img alt="Admin User Profile" class="w-full h-full object-cover"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuAbBo2Ftpqk0meUql9w_WjDlyGnnsIj_3erLBPH-jIlcxFmJg2wZ-NJTPfALW0szHLgXffQI3TIvWNeAz3ALftLmt1kuJkDfZbj6lAN8qugxplf3bxm1h-6DTDFpF4PgB53LF5MVCNAigSaeVtB2apGiFVEpjR_VXuOb8gbUg5WrKi83JTWc59c0Qo1E9ysfRXEwNHj0jBYIl769v1z5zmHVLR66NO_SeYmRmjldFARfEpPB3dPgpyL">
            </div>
            <span class="font-headline-sm text-sm text-primary font-bold">PureNest Admin</span>
        </div>
        <button
            onclick="document.getElementById('mobile-sidebar')?.classList.toggle('-translate-x-full'); document.getElementById('sidebar-backdrop')?.classList.toggle('hidden')"
            class="p-2 rounded-lg text-on-surface-variant hover:bg-surface-variant transition-colors">
            <span class="material-symbols-outlined">menu</span>
        </button>
    </div>

    <!-- Main Content Area -->
    <main class="mb-20 lg:mb-0 flex-1 md:ml-64 overflow-y-auto w-full relative bg-background">
        <!-- Page Header -->
        <header
            class="flex-wrap gap-2 lg:gap-2 pb-6 pt-20 lg:pt-6 bg-background/80 backdrop-blur-md px-margin-mobile md:px-margin-desktop py-6 flex justify-between items-center border-b border-outline-variant/30">
            <div>
                <h2 class="font-headline-md text-headline-md text-primary">Reservations</h2>
                <p class="font-body-md text-body-md text-on-surface-variant mt-1">Review schedules and manage
                    reservations.</p>
            </div>
            <div class="flex items-center gap-4">
                <a href="admin-reservation.html"
                    class="bg-primary text-on-primary font-label-caps text-label-caps px-6 py-3 rounded flex items-center gap-2 hover:opacity-90 transition-opacity">
                    <span class="material-symbols-outlined text-sm">add</span>
                    NEW RESERVATION
                </a>
            </div>
        </header>
        <div class="px-margin-mobile md:px-margin-desktop py-8 max-w-container-max mx-auto w-full">
            <!-- Content Container -->
            <div
                class="mb-8 p-6 bg-surface-container-low/50 rounded-xl border border-outline-variant/30 flex flex-wrap items-end gap-6">
                <div class="w-full lg:w-auto flex flex-col gap-2">
                    <label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Year</label>
                    <select
                        class="bg-surface-container-lowest border border-outline-variant/50 rounded-DEFAULT px-4 py-2 text-body-md font-body-md focus:ring-1 focus:ring-primary focus:border-primary outline-none min-w-[120px]">
                        <option value="">All Years</option>
                    </select>
                </div>
                <div class="w-full lg:w-auto flex flex-col gap-2">
                    <label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Month</label>
                    <select
                        class="bg-surface-container-lowest border border-outline-variant/50 rounded-DEFAULT px-4 py-2 text-body-md font-body-md focus:ring-1 focus:ring-primary focus:border-primary outline-none min-w-[140px]">
                        <option value="">All Months</option>
                        <option value="1">January</option>
                        <option value="2">February</option>
                        <option value="3">March</option>
                        <option value="4">April</option>
                        <option value="5">May</option>
                        <option value="6">June</option>
                        <option value="7">July</option>
                        <option value="8">August</option>
                        <option value="9">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                </div>
                <div class="w-full lg:w-auto flex flex-col gap-2">
                    <label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Start Date</label>
                    <input type="date"
                        class="bg-surface-container-lowest border border-outline-variant/50 rounded-DEFAULT px-4 py-2 text-body-md font-body-md focus:ring-1 focus:ring-primary focus:border-primary outline-none">
                </div>
                <div class="w-full lg:w-auto flex flex-col gap-2">
                    <label class="font-label-caps text-label-caps text-on-surface-variant uppercase">End Date</label>
                    <input type="date"
                        class="bg-surface-container-lowest border border-outline-variant/50 rounded-DEFAULT px-4 py-2 text-body-md font-body-md focus:ring-1 focus:ring-primary focus:border-primary outline-none">
                </div>
                <div class="flex gap-2 w-full lg:w-auto">
                    <button id="btn-apply-filters"
                        class="flex-1 lg:flex-none bg-primary text-on-primary px-6 py-2 rounded-DEFAULT font-label-caps text-label-caps hover:opacity-90 transition-opacity h-10">
                        Apply Filters
                    </button>
                    <button id="btn-clear-filters"
                        class="flex-1 lg:flex-none bg-surface-container-highest text-on-surface-variant px-4 py-2 rounded-DEFAULT font-label-caps text-label-caps hover:bg-surface-variant transition-opacity h-10">
                        Clear
                    </button>
                </div>
            </div>
            <div
                class="bg-surface-container-lowest rounded-xl border border-outline-variant/30 shadow-[0_4px_40px_rgba(27,48,34,0.04)] overflow-hidden">
                <div
                    class="p-6 border-b border-outline-variant/30 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 bg-surface-warm/30">
                    <div class="flex space-x-1 overflow-x-auto w-full md:w-auto pb-2 md:pb-0 hide-scrollbar">
                        <button
                            class="px-4 py-2 font-body-md text-body-md font-medium text-primary bg-surface-container-low rounded-lg whitespace-nowrap transition-colors">All</button>
                        <button
                            class="px-4 py-2 font-body-md text-body-md text-on-surface-variant hover:text-primary hover:bg-surface-container-low/50 rounded-lg whitespace-nowrap transition-colors">Pending</button>
                        <button
                            class="px-4 py-2 font-body-md text-body-md text-on-surface-variant hover:text-primary hover:bg-surface-container-low/50 rounded-lg whitespace-nowrap transition-colors">Confirmed</button>
                        <button
                            class="px-4 py-2 font-body-md text-body-md text-on-surface-variant hover:text-primary hover:bg-surface-container-low/50 rounded-lg whitespace-nowrap transition-colors">Initiated</button>
                        <button
                            class="px-4 py-2 font-body-md text-body-md text-on-surface-variant hover:text-primary hover:bg-surface-container-low/50 rounded-lg whitespace-nowrap transition-colors">On
                            The Way</button>
                        <button
                            class="px-4 py-2 font-body-md text-body-md text-on-surface-variant hover:text-primary hover:bg-surface-container-low/50 rounded-lg whitespace-nowrap transition-colors">Rescheduled</button>
                        <button
                            class="px-4 py-2 font-body-md text-body-md text-on-surface-variant hover:text-primary hover:bg-surface-container-low/50 rounded-lg whitespace-nowrap transition-colors">Completed</button>
                        <button
                            class="px-4 py-2 font-body-md text-body-md text-on-surface-variant hover:text-primary hover:bg-surface-container-low/50 rounded-lg whitespace-nowrap transition-colors">Cancelled</button>
                    </div>
                    <!-- Search within table -->
                    <div class="relative w-full md:w-64">
                        <span
                            class="material-symbols-outlined absolute left-3 top-1/2 transform -translate-y-1/2 text-on-surface-variant text-[18px]">search</span>
                        <input
                            class="w-full pl-9 pr-4 py-2 bg-surface-container-lowest border border-outline-variant/50 focus:outline-none focus:border-primary focus:ring-0 text-body-md font-body-md placeholder:text-outline-muted transition-all border-t-0 border-l-0 border-r-0 border-b bg-transparent"
                            placeholder="Search ID, Name..." style="border-bottom-width: 1px;" type="text">
                    </div>
                </div>

                <!-- VISTA MÓVIL: Tarjetas Adaptativas UI/UX -->
                <div id="mobile-reservations-container" class="block md:hidden divide-y divide-outline-variant/20 bg-surface/30">
                    <!-- Inyectado dinámicamente por JS -->
                </div>

                <!-- VISTA ESCRITÓRIO: Tabla Clásica -->
                <div class="overflow-x-auto hidden md:block">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-outline-variant/30 bg-surface-warm/10">
                                <th
                                    class="py-4 px-6 font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">
                                    ID</th>
                                <th
                                    class="py-4 px-6 font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">
                                    Customer</th>
                                <th
                                    class="py-4 px-6 font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">
                                    Service Type</th>
                                <th
                                    class="py-4 px-6 font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">
                                    Staff Assigned</th>
                                <th
                                    class="py-4 px-6 font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">
                                    Date &amp; Time</th>
                                <th
                                    class="py-4 px-6 font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">
                                    Status</th>
                                <th
                                    class="py-4 px-6 font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider text-right">
                                    Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-outline-variant/20">
                            <!-- Rows injected dynamically by JS -->
                        </tbody>
                    </table>
                </div>
                <!-- Pagination Footer -->
                <div
                    class="p-4 border-t border-outline-variant/30 flex items-center justify-between bg-surface-container-lowest">
                    <span class="font-body-md text-[14px] text-on-surface-variant">Showing 1 to 3 of 12 entries</span>
                    <div class="flex space-x-2">
                        <button class="p-1 text-outline-muted cursor-not-allowed">
                            <span class="material-symbols-outlined">chevron_left</span>
                        </button>
                        <button class="p-1 text-on-surface-variant hover:text-primary transition-colors">
                            <span class="material-symbols-outlined">chevron_right</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Interactive Reservation Modal -->
    <div class="fixed inset-0 z-[100] flex items-center justify-center p-4 md:p-8 hidden pointer-events-none"
        id="reservation-modal">
        <div class="absolute inset-0 bg-on-surface/40 backdrop-blur-sm" id="modal-backdrop"></div>
        <div
            class="relative bg-surface-container-lowest w-full max-w-4xl rounded-xl soft-shadow overflow-hidden flex flex-col max-h-[90vh] pointer-events-auto">
            <header
                class="px-8 py-6 border-b border-outline-variant/30 flex justify-between items-center bg-surface-warm">
                <div class="flex items-center gap-4">
                    <h2 class="font-headline-sm text-headline-sm text-primary" id="modal-title">Reservation #RES-0000
                    </h2>
                    <div id="modal-status-badge"></div>
                </div>
                <button class="text-outline hover:text-primary transition-colors cursor-pointer" id="modal-close-btn">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </header>
            <div class="flex-1 overflow-y-auto p-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <!-- Left Column: Customer Details -->
                    <div class="flex flex-col gap-6">
                        <h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">
                            Customer Details</h3>
                        <div class="flex flex-col gap-4">
                            <div class="flex flex-col gap-2">
                                <label class="text-xs font-label-caps text-outline uppercase">Full Name</label>
                                <input
                                    class="pointer-events-none w-full px-4 py-3 rounded-lg border border-outline-variant/50 bg-surface-bright font-body-md"
                                    type="text" id="modal-fullname" readonly />
                            </div>
                            <div class="flex flex-col gap-2">
                                <label class="text-xs font-label-caps text-outline uppercase">Email Address</label>
                                <input
                                    class="pointer-events-none w-full px-4 py-3 rounded-lg border border-outline-variant/50 bg-surface-bright font-body-md"
                                    type="email" id="modal-email" readonly />
                            </div>
                            <div class="flex flex-col gap-2">
                                <label class="text-xs font-label-caps text-outline uppercase">Phone Number</label>
                                <input
                                    class="pointer-events-none w-full px-4 py-3 rounded-lg border border-outline-variant/50 bg-surface-bright font-body-md"
                                    type="tel" id="modal-phone" readonly />
                            </div>
                            <div class="flex flex-col gap-2">
                                <label class="text-xs font-label-caps text-outline uppercase">Service Address</label>
                                <input
                                    class="pointer-events-none w-full px-4 py-3 rounded-lg border border-outline-variant/50 bg-surface-bright font-body-md"
                                    type="text" id="modal-address" readonly />
                            </div>
                        </div>
                    </div>
                    <!-- Right Column: Booking Details -->
                    <div class="flex flex-col gap-6">
                        <h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">
                            Booking Details</h3>
                        <div class="flex flex-col gap-4">
                            <div class="flex flex-col gap-2">
                                <label class="text-xs font-label-caps text-outline uppercase">Service Type</label>
                                <select id="modal-service" disabled
                                    class="pointer-events-none w-full px-4 py-3 rounded-lg border border-outline-variant/50 bg-surface-bright font-body-md">
                                </select>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="flex flex-col gap-2">
                                    <label class="text-xs font-label-caps text-outline uppercase">Bedrooms</label>
                                    <input id="modal-bedrooms"
                                        class="pointer-events-none w-full px-4 py-3 rounded-lg border border-outline-variant/50 bg-surface-bright font-body-md"
                                        type="text" readonly />
                                </div>
                                <div class="flex flex-col gap-2">
                                    <label class="text-xs font-label-caps text-outline uppercase">Bathrooms</label>
                                    <input id="modal-bathrooms"
                                        class="pointer-events-none w-full px-4 py-3 rounded-lg border border-outline-variant/50 bg-surface-bright font-body-md"
                                        type="text" readonly />
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="flex flex-col gap-2">
                                    <label class="text-xs font-label-caps text-outline uppercase">Frequency</label>
                                    <input id="modal-frequency"
                                        class="pointer-events-none w-full px-4 py-3 rounded-lg border border-outline-variant/50 bg-surface-bright font-body-md"
                                        type="text" readonly />
                                </div>
                                <div class="flex flex-col gap-2">
                                    <label class="text-xs font-label-caps text-outline uppercase">Total Price</label>
                                    <input id="modal-price"
                                        class="pointer-events-none w-full px-4 py-3 rounded-lg border border-outline-variant/50 bg-surface-bright font-body-md font-bold text-primary"
                                        type="text" readonly />
                                </div>
                            </div>
                            <div class="flex flex-col gap-2">
                                <label class="text-xs font-label-caps text-outline uppercase">Date &amp; Time</label>
                                <input id="modal-datetime"
                                    class="pointer-events-none w-full px-4 py-3 rounded-lg border border-outline-variant/50 bg-surface-bright font-body-md"
                                    type="text" readonly />
                            </div>
                            <div class="flex flex-col gap-2">
                                <label class="text-xs font-label-caps text-outline uppercase">Additional Notes</label>
                                <textarea id="modal-notes"
                                    class="pointer-events-none w-full px-4 py-3 rounded-lg border border-outline-variant/50 bg-surface-bright font-body-md resize-none"
                                    rows="2" readonly></textarea>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Secondary Actions Row (Status Change Buttons) -->
                <div class="mt-12 pt-8 border-t border-outline-variant/30 flex flex-wrap gap-4">
                    <div class="w-full flex flex-col gap-4">
                        <div id="modal-action-inputs"
                            class="flex flex-col gap-3 p-4 rounded-xl bg-surface-variant/30 border border-outline-variant/30 hidden">
                            <div id="price-input-wrapper" class="flex flex-col gap-1.5 hidden">
                                <label class="text-xs font-label-caps text-primary font-bold uppercase">Set Real Price
                                    ($)</label>
                                <input type="number" step="0.01" id="modal-input-price" placeholder="e.g. 150.00"
                                    class="w-full px-4 py-2.5 rounded-lg border border-outline-variant/50 bg-surface focus:border-primary focus:ring-0 font-body-md">
                            </div>
                            <div id="reschedule-input-wrapper" class="flex flex-col gap-1.5 hidden">
                                <label class="text-xs font-label-caps text-gold font-bold uppercase">Select New Date
                                    &amp; Time</label>
                                <input type="datetime-local" id="modal-input-reschedule-datetime"
                                    class="w-full px-4 py-2.5 rounded-lg border border-outline-variant/50 bg-surface focus:border-primary focus:ring-0 font-body-md">
                            </div>
                            <div id="reason-input-wrapper" class="flex flex-col gap-1.5 hidden">
                                <label class="text-xs font-label-caps text-error font-bold uppercase">Rejected Reason /
                                    Notes</label>
                                <textarea id="modal-input-reason"
                                    placeholder="Explain why the service is being cancelled..."
                                    class="w-full px-4 py-2.5 rounded-lg border border-outline-variant/50 bg-surface focus:border-primary focus:ring-0 font-body-md resize-none"
                                    rows="2"></textarea>
                            </div>
                        </div>

                        <div class="flex flex-wrap gap-3 justify-end">
                            <button id="modal-btn-quote-action"
                                class="px-5 py-2.5 rounded-lg border border-primary-fixed bg-primary-fixed text-primary-container font-label-caps text-label-caps hover:bg-primary-fixed/80 transition-all flex items-center justify-center gap-2">
                                <span class="material-symbols-outlined text-sm">payments</span> Set Price &amp; Quote
                            </button>
                            <button id="modal-btn-reschedule-action"
                                class="flex-1 md:flex-none px-6 py-3 rounded-lg border border-outline-variant/50 bg-surface-container text-navy font-label-caps text-label-caps hover:bg-surface-variant transition-all flex items-center justify-center gap-2">
                                <span class="material-symbols-outlined text-sm">event_repeat</span> Reschedule Service
                            </button>
                            <button id="modal-btn-reject-action"
                                class="px-5 py-2.5 rounded-lg border border-error/30 text-error font-label-caps text-label-caps hover:bg-error-container transition-all flex items-center justify-center gap-2">
                                <span class="material-symbols-outlined text-sm">cancel</span> Rejected Service
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/modules/layout-admin.js"></script>
    <script type="module" src="js/modules/admin-reservation-list.js"></script>
</body>

</html>
