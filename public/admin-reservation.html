<!DOCTYPE html>
<html class="light scroll-smooth" lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="theme-color" content="#4f46e5">
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Luxuria Pure Cleaning Services | Professional Home & Commercial Cleaning</title>
    <meta name="title" content="Luxuria Pure Cleaning Services | Professional Home & Commercial Cleaning">
    <meta name="description" content="Experience top-tier residential and commercial cleaning services. Reliable, insured, and detail-oriented professionals dedicated to keeping your spaces pristine.">
    <meta name="keywords" content="cleaning services, residential cleaning, commercial cleaning, deep cleaning, professional cleaners, home cleaning">
    <meta name="author" content="ARFLOW">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cleaning.mutechlabs.com/">
    <meta property="og:title" content="Luxuria Pure Cleaning Services | Professional Home & Commercial Cleaning">
    <meta property="og:description" content="Experience top-tier residential and commercial cleaning services. Reliable, insured, and detail-oriented professionals dedicated to keeping your spaces pristine.">
    <meta property="og:image" content="https://cleaning.mutechlabs.com/public/assets/img/LuxuriaPureCover.png">

    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://cleaning.mutechlabs.com/">
    <meta property="twitter:title" content="Luxuria Pure Cleaning Services | Professional Home & Commercial Cleaning">
    <meta property="twitter:description" content="Experience top-tier residential and commercial cleaning services. Reliable, insured, and detail-oriented professionals dedicated to keeping your spaces pristine.">
    <meta property="twitter:image" content="https://cleaning.mutechlabs.com/public/assets/img/LuxuriaPureCover.png">

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&amp;display=swap"
        rel="stylesheet" />
    <script src="tailwind.js" id="tailwind-config"></script>
    <script src="js/modules/auth-guard.js"></script>
</head>

<body
    class="bg-background text-on-background min-h-screen flex selection:bg-primary-fixed selection:text-primary-container">
    <div id="sideAdminMenu"></div>
    <div id="sidebar-backdrop"
        onclick="document.getElementById('mobile-sidebar')?.classList.add('-translate-x-full'); this.classList.add('hidden')"
        class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 hidden md:hidden"></div>

<div class="md:hidden fixed top-0 left-0 w-full z-30 flex items-center justify-between bg-surface-container-lowest p-4 border-b border-outline-variant/30 shadow-sm">
        <div class="flex items-center gap-3">
            
            <span class="font-serif text-4xl tracking-tight text-navy">Luxuria<span class="text-gold">
                                Pure</span></span>
        </div>
        <button onclick="document.getElementById('mobile-sidebar')?.classList.toggle('-translate-x-full'); document.getElementById('sidebar-backdrop')?.classList.toggle('hidden')" class="p-2 rounded-lg text-on-surface-variant hover:bg-surface-variant transition-colors">
            <span class="material-symbols-outlined">menu</span>
        </button>
    </div>

    <main class="mb-20 lg:mb-0 flex-1 md:ml-64 p-margin-mobile md:p-margin-desktop min-h-screen">
        <header class="flex-wrap gap-2 lg:gap-2 pt-20 lg:pt-6 flex justify-between items-end border-b border-outline-variant/30 pb-6">
            <div>
                <h2 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">Reservation
                </h2>
                <p class="font-body-lg text-body-lg text-on-surface-variant mt-2 max-w-2xl">Management reservation.</p>
            </div>
        </header>
        <div class="pt-6 lg:pt-20 pb-24 lg:px-margin-desktop flex-1 flex justify-center">
            <div
                class="w-full max-w-4xl bg-surface-container-lowest rounded-2xl shadow-sm border border-outline-variant/30 p-12 relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-bl-full pointer-events-none"></div>
                <div class="mb-12">
                    <h3 class="font-headline-md text-headline-md text-primary mb-2">Create New Reservation</h3>
                    <p class="font-body-md text-body-md text-on-surface-variant">Enter client and service details to
                        schedule a new premium cleaning appointment.</p>
                </div>
                <form id="reservationForm" class="space-y-section-gap" novalidate>

                    <!-- Customer Information -->
                    <section>
                        <div class="flex items-center gap-3 mb-8 pb-4 border-b border-outline-variant/30">
                            <span class="material-symbols-outlined text-primary" data-icon="person">person</span>
                            <h4 class="font-headline-sm text-headline-sm text-primary">Customer Information</h4>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div class="space-y-2">
                                <label class="font-label-caps text-label-caps text-on-surface-variant uppercase"
                                    for="firstName">First Name</label>
                                <input
                                    class="w-full bg-transparent border-0 border-b border-outline-muted focus:border-primary focus:ring-0 px-0 py-3 font-body-md text-body-md text-on-surface transition-colors placeholder:text-outline-muted"
                                    id="firstName" placeholder="Jane" type="text" />
                            </div>
                            <div class="space-y-2">
                                <label class="font-label-caps text-label-caps text-on-surface-variant uppercase"
                                    for="lastName">Last Name</label>
                                <input
                                    class="w-full bg-transparent border-0 border-b border-outline-muted focus:border-primary focus:ring-0 px-0 py-3 font-body-md text-body-md text-on-surface transition-colors placeholder:text-outline-muted"
                                    id="lastName" placeholder="Doe" type="text" />
                            </div>
                            <div class="space-y-2">
                                <label class="font-label-caps text-label-caps text-on-surface-variant uppercase"
                                    for="email">Email Address</label>
                                <input
                                    class="w-full bg-transparent border-0 border-b border-outline-muted focus:border-primary focus:ring-0 px-0 py-3 font-body-md text-body-md text-on-surface transition-colors placeholder:text-outline-muted"
                                    id="email" placeholder="jane.doe@example.com" type="email" />
                            </div>
                            <div class="space-y-2">
                                <label class="font-label-caps text-label-caps text-on-surface-variant uppercase"
                                    for="phone">Phone Number</label>
                                <input
                                    class="w-full bg-transparent border-0 border-b border-outline-muted focus:border-primary focus:ring-0 px-0 py-3 font-body-md text-body-md text-on-surface transition-colors placeholder:text-outline-muted"
                                    id="phone" placeholder="5551234567" type="tel" />
                            </div>
                        </div>
                    </section>

                    <!-- Service Details -->
                    <section>
                        <div class="flex items-center gap-3 mb-8 pb-4 border-b border-outline-variant/30">
                            <span class="material-symbols-outlined text-primary"
                                data-icon="cleaning_services">cleaning_services</span>
                            <h4 class="font-headline-sm text-headline-sm text-primary">Service Details</h4>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                            <div class="space-y-2 md:col-span-2">
                                <label class="font-label-caps text-label-caps text-on-surface-variant uppercase"
                                    for="serviceType">Service Type</label>
                                <select
                                    class="w-full bg-transparent border-0 border-b border-outline-muted focus:border-primary focus:ring-0 px-0 py-3 font-body-md text-body-md text-on-surface transition-colors appearance-none cursor-pointer"
                                    id="serviceType">
                                    <option value="">Select a cleaning service...</option>
                                </select>
                            </div>

                            <!-- Bedrooms & Bathrooms -->
                            <div class="space-y-2">
                                <label class="font-label-caps text-label-caps text-on-surface-variant uppercase"
                                    for="serviceBedrooms">Bedrooms</label>
                                <select
                                    class="w-full bg-transparent border-0 border-b border-outline-muted focus:border-primary focus:ring-0 px-0 py-3 font-body-md text-body-md text-on-surface transition-colors appearance-none cursor-pointer"
                                    id="serviceBedrooms">
                                    <option value="1">1 Bedroom</option>
                                    <option value="2">2 Bedrooms</option>
                                    <option value="3">3 Bedrooms</option>
                                    <option value="4">4+ Bedrooms</option>
                                </select>
                            </div>
                            <div class="space-y-2">
                                <label class="font-label-caps text-label-caps text-on-surface-variant uppercase"
                                    for="serviceBathrooms">Bathrooms</label>
                                <select
                                    class="w-full bg-transparent border-0 border-b border-outline-muted focus:border-primary focus:ring-0 px-0 py-3 font-body-md text-body-md text-on-surface transition-colors appearance-none cursor-pointer"
                                    id="serviceBathrooms">
                                    <option value="1">1 Bathroom</option>
                                    <option value="1.5">1.5 Bathrooms</option>
                                    <option value="2">2 Bathrooms</option>
                                    <option value="3">3+ Bathrooms</option>
                                </select>
                            </div>

                            <div class="space-y-2">
                                <label class="font-label-caps text-label-caps text-on-surface-variant uppercase"
                                    for="serviceDate">Service Date</label>
                                <input
                                    class="w-full bg-transparent border-0 border-b border-outline-muted focus:border-primary focus:ring-0 px-0 py-3 font-body-md text-body-md text-on-surface transition-colors"
                                    id="serviceDate" type="date" />
                            </div>
                            <div class="space-y-2">
                                <label class="font-label-caps text-label-caps text-on-surface-variant uppercase"
                                    for="serviceTime">Preferred Time</label>
                                <input
                                    class="w-full bg-transparent border-0 border-b border-outline-muted focus:border-primary focus:ring-0 px-0 py-3 font-body-md text-body-md text-on-surface transition-colors"
                                    id="serviceTime" type="time" />
                            </div>
                            <div class="space-y-2 md:col-span-2">
                                <label class="font-label-caps text-label-caps text-on-surface-variant uppercase"
                                    for="address">Service Address</label>
                                <input
                                    class="w-full bg-transparent border-0 border-b border-outline-muted focus:border-primary focus:ring-0 px-0 py-3 font-body-md text-body-md text-on-surface transition-colors placeholder:text-outline-muted"
                                    id="address" placeholder="123 Luxury Lane, Apt 4B" type="text" />
                            </div>

                            <!-- Frequency Selection Buttons -->
                            <div class="space-y-2 md:col-span-2">
                                <label
                                    class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-2 block">Frequency</label>
                                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="frequencyGroup">
                                    <button
                                        class="freq-btn border border-primary bg-surface-container-low rounded-xl py-3 text-sm text-primary font-medium transition-colors"
                                        type="button" data-freq="One-time">One-time</button>
                                    <button
                                        class="freq-btn border border-outline-variant/50 rounded-xl py-3 text-sm text-on-surface hover:border-primary transition-colors"
                                        type="button" data-freq="Weekly">Weekly</button>
                                    <button
                                        class="freq-btn border border-outline-variant/50 rounded-xl py-3 text-sm text-on-surface hover:border-primary transition-colors"
                                        type="button" data-freq="Bi-weekly">Bi-weekly</button>
                                    <button
                                        class="freq-btn border border-outline-variant/50 rounded-xl py-3 text-sm text-on-surface hover:border-primary transition-colors"
                                        type="button" data-freq="Monthly">Monthly</button>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Internal Notes / Special Instructions -->
                    <section>
                        <div class="flex items-center gap-3 mb-8 pb-4 border-b border-outline-variant/30">
                            <span class="material-symbols-outlined text-primary" data-icon="notes">notes</span>
                            <h4 class="font-headline-sm text-headline-sm text-primary">Internal Notes</h4>
                        </div>
                        <div class="space-y-2">
                            <label class="font-label-caps text-label-caps text-on-surface-variant uppercase"
                                for="notes">Special Instructions / Gate Codes</label>
                            <textarea
                                class="w-full bg-surface-container-low border border-outline-variant/50 rounded-xl focus:border-primary focus:ring-1 focus:ring-primary p-4 font-body-md text-body-md text-on-surface transition-colors placeholder:text-outline-muted resize-none"
                                id="notes"
                                placeholder="Add any specific requirements, access codes, or pet information here..."
                                rows="4"></textarea>
                        </div>
                    </section>

                    <!-- Actions -->
                    <div class="pt-8 flex-wrap flex items-center justify-end gap-6 border-t border-outline-variant/30">
                        <button id="btnCancel"
                            class="w-full lg:w-auto font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors px-6 py-4 rounded-xl border border-transparent hover:border-outline-variant/50"
                            type="button">
                            CANCEL
                        </button>
                        <button id="btnSubmit"
                            class="w-full lg:w-auto bg-primary text-on-primary font-label-caps text-label-caps px-10 py-4 rounded-xl hover:bg-primary/90 transition-colors shadow-sm"
                            type="submit">
                            CREATE RESERVATION
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script type="module" src="js/modules/layout-admin.js"></script>
    <script type="module" src="js/modules/admin-reservation-form.js"></script>
</body>

</html>
