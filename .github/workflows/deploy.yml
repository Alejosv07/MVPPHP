name: Deploy via FTP

on:
  push:
    branches: [ main ]

jobs:
  web-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Sync files to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.mutechlabs.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Encrypted FTP (credentials are no longer sent in clear text)
          protocol: ftps
          port: 21
          server-dir: /public_html/
          # Never upload (or delete on the server) secrets, runtime data or tooling
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            api/config/secrets.php
            api/storage/**
            **/*.sql
            **/*.log
            php_errorlog
            Dockerfile
            docker-compose.yml
            *.md
